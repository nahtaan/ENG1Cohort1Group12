plugins {
    id 'java'
    id "com.gradleup.shadow" version "9.3.0"
}

group = 'eng1.c1group12'
version = '1.0'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    implementation "org.jmonkeyengine:jme3-core:3.8.0-stable"
    implementation "org.jmonkeyengine:jme3-desktop:3.8.0-stable"
    implementation "org.jmonkeyengine:jme3-lwjgl3:3.8.0-stable"
}

test {
    useJUnitPlatform()
}

build {
    dependsOn(shadowJar)
}

jar {
    manifest {
        attributes(
                "main-class": "eng1.c1group12.Main"
        )
    }
}

tasks.register('runGame', Exec) {
    dependsOn 'build'

    commandLine 'java', '-jar', 'build/libs/game-1.0-all.jar'
}
